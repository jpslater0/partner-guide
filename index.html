<title>Stationhead</title>
<meta name="description" content="Stationhead is the home of social listening.">
<style>
:root{
 --black:#282526; --white:#FCFCFC; --purple:#A663FF; --mint:#79FFD2;
 --indigo:#4B31C2; --cobalt:#2345E5; --aqua:#2DD3FF; --pink:#E994DF; --gold:#F5BD51;
 --surface:#121212;
 --font:"Acumin Pro","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--surface);color:var(--white);font-family:var(--font);
 -webkit-font-smoothing:antialiased;line-height:1.4}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(18,18,18,.94);
 backdrop-filter:blur(14px);border-bottom:1px solid rgba(252,252,252,.10)}
#bar .row{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
#bar .row::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:transparent;color:var(--white);border:1px solid rgba(252,252,252,.26);
 border-radius:999px;padding:8px 15px;font:inherit;font-size:13px;font-weight:600;
 letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--purple);border-color:var(--purple);color:#140b24}
#count{flex:0 0 auto;align-self:center;font-size:11px;letter-spacing:.03em;
 color:rgba(252,252,252,.55);padding:0 6px;white-space:nowrap}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.card{scroll-snap-align:start;min-height:100%;display:flex;align-items:center;
 padding:96px 22px 56px;border-bottom:1px solid rgba(252,252,252,.07)}
.card[hidden]{display:none}
.inner{width:100%;max-width:560px;margin:0 auto}
.kicker{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
 color:var(--mint);margin-bottom:16px}
h1{font-size:38px;line-height:1.08;font-weight:800;letter-spacing:-.025em;margin-bottom:16px}
h2{font-size:29px;line-height:1.14;font-weight:800;letter-spacing:-.02em;margin-bottom:16px}
h1 em,h2 em{font-style:normal;color:var(--purple)}
.sub{font-size:18px;color:rgba(252,252,252,.86);margin-bottom:18px}
.lead{font-size:16px;color:rgba(252,252,252,.80);margin-bottom:13px}
.lead.big{font-size:19px;color:var(--white)}
.fine{font-size:11.5px;color:rgba(252,252,252,.44);margin-top:18px;letter-spacing:.03em}
.scrollcue{margin-top:34px;font-size:11px;letter-spacing:.03em;text-transform:uppercase;
 color:rgba(252,252,252,.42)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
.stat{background:rgba(252,252,252,.05);border:1px solid rgba(252,252,252,.10);
 border-radius:14px;padding:15px 14px}
.stat b{display:block;font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--mint);
 margin-bottom:5px}
.stat span{display:block;font-size:12px;color:rgba(252,252,252,.66);line-height:1.32}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.tile{display:block;text-decoration:none;color:inherit;background:rgba(252,252,252,.05);
 border:1px solid rgba(252,252,252,.10);border-radius:13px;padding:8px 7px;text-align:center}
.tw{display:flex;align-items:center;justify-content:center;width:100%;height:50px;
 margin:0 auto 8px;border-radius:10px;overflow:hidden;background:#5f5c60;
 position:relative;padding:6px 8px}
.tw img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.tw.fallback::after{content:attr(data-fb);position:absolute;inset:0;display:flex;
 align-items:center;justify-content:center;font-size:8px;font-weight:700;letter-spacing:.03em;
 padding:3px;text-align:center;line-height:1.1}
.tn{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{display:block;font-size:10px;color:rgba(252,252,252,.52);margin-top:2px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.step{background:rgba(252,252,252,.05);border:1px solid rgba(252,252,252,.12);border-radius:13px;
 padding:12px 5px;color:var(--white);font:inherit;cursor:pointer;text-align:center}
.step.on{border-color:var(--purple);background:rgba(166,99,255,.17)}
.step b{display:block;font-size:19px;font-weight:800;color:var(--purple);margin-bottom:3px}
.step span{display:block;font-size:10.5px;letter-spacing:.03em;color:rgba(252,252,252,.74);line-height:1.2}
.reveal{background:rgba(252,252,252,.05);border:1px solid rgba(252,252,252,.10);
 border-radius:14px;padding:16px;min-height:104px}
.reveal p{font-size:15px;color:rgba(252,252,252,.84)}
.reveal a{display:inline-block;margin-top:10px;color:var(--mint);font-weight:700;font-size:13.5px;
 letter-spacing:.03em}
.steps-list{margin:0 0 4px 0;padding-left:20px}
.steps-list li{font-size:15.5px;color:rgba(252,252,252,.80);margin-bottom:10px;padding-left:3px}
.steps-list b{color:var(--white)}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:24px;font-size:15.5px;color:rgba(252,252,252,.80);
 margin-bottom:11px}
.ticks li::before{content:"";position:absolute;left:2px;top:8px;width:9px;height:9px;
 border-radius:50%;background:var(--mint)}
.ticks b{color:var(--white)}
blockquote{background:rgba(252,252,252,.05);border-left:3px solid var(--purple);
 border-radius:0 13px 13px 0;padding:15px 16px;margin:2px 0 4px}
blockquote p{font-size:16px;color:var(--white);margin-bottom:6px}
blockquote p:last-child{margin-bottom:0;color:var(--mint);font-weight:700}
.need{margin-top:16px;font-size:14px;color:rgba(252,252,252,.74);background:rgba(252,252,252,.05);
 border:1px solid rgba(252,252,252,.10);border-radius:13px;padding:14px}
.need b{color:var(--white)}
.future{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:16px 0 34px}
.future em{font-style:normal;color:var(--mint)}
.lockup{display:flex;flex-direction:column;gap:7px}
.wordmark{display:block;width:196px;max-width:70%}
.wordmark .mk{display:block;width:100%;height:auto}
.tagline{font-size:12px;letter-spacing:.03em;color:rgba(252,252,252,.58)}

/* ---- affordances: show what is tappable and where it goes ---- */
.tile{position:relative;padding-top:14px}
.tile::after{content:"↗";position:absolute;top:7px;right:9px;font-size:12px;
 font-weight:700;line-height:1;color:var(--mint);opacity:.75}
.tile:hover::after,.tile:focus::after{opacity:1}
.reveal a::after{content:" →";font-weight:800}
.step{position:relative;padding-bottom:17px}
.step::after{content:"⌄";position:absolute;left:0;right:0;bottom:2px;font-size:13px;
 line-height:1;color:rgba(252,252,252,.34)}
.step.on::after{color:var(--purple)}
.need b::after,.stat b::after{content:""}
#bar{position:fixed}
#bar .row{position:relative;padding-right:30px}
#bar::after{content:"›";position:absolute;top:0;right:0;height:100%;width:30px;
 display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
 color:rgba(252,252,252,.50);pointer-events:none;
 background:linear-gradient(to right,rgba(18,18,18,0),rgba(18,18,18,.96) 42%)}
.scrollcue{display:flex;align-items:center;gap:8px}
.scrollcue::after{content:"⌄";font-size:19px;line-height:.6;color:var(--mint);
 animation:nudge 1.7s ease-in-out infinite}
.next{margin-top:30px;height:16px;text-align:center;color:rgba(252,252,252,.30)}
.next::after{content:"⌄";font-size:19px;line-height:.6;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media(prefers-reduced-motion:reduce){
 .scrollcue::after,.next::after{animation:none}
}
@media(min-width:720px){
 h1{font-size:52px} h2{font-size:38px}
 .wall{grid-template-columns:repeat(4,1fr)}
}
@media print{
 @page{margin:14mm}
 body{background:#fff;color:#282526}
 #bar{display:none}
 #feed{height:auto;overflow:visible;scroll-snap-type:none}
 .card{min-height:0;page-break-inside:avoid;break-inside:avoid;padding:0 0 20mm;
  border-bottom:1px solid #ddd;display:block}
 .card[hidden]{display:block}
 .kicker{color:#4B31C2}
 h1 em,h2 em{color:#4B31C2}
 .sub,.lead,.steps-list li,.ticks li,.reveal p{color:#3a3739}
 .fine,.ta,.tagline{color:#6b6769}
 .stat,.tile,.reveal,.need,blockquote,.step{background:#f5f4f5;border-color:#ddd}
 .stat b{color:#4B31C2}
 .reveal p[hidden]{display:block!important}
 .reveal a{color:#2345E5}
 .future em{color:#4B31C2}
 .wordmark .mk{filter:invert(1)}
 .scrollcue,.next,#bar::after{display:none}
 .tile::after{color:#4B31C2}
 .step::after{color:#4B31C2}
 .reveal a::after{content:" →"}
}

.barmark{flex:0 0 auto;display:block;width:26px;padding:2px 2px 0}
.barmark .mk{display:block;width:100%;height:auto}
@media print{.barmark{display:none}}

body{display:flex;align-items:center;justify-content:center;padding:40px 22px}
#feed{height:auto;overflow:visible}
.land{width:100%;max-width:520px}
.land .wordmark{display:block;width:300px;max-width:82%;color:var(--white);margin-bottom:16px}
.land .wordmark .mk{display:block;width:100%;height:auto}
.land .tag{font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--mint);margin-bottom:38px}
.choice{display:block;text-decoration:none;color:inherit;background:rgba(252,252,252,.05);
 border:1px solid rgba(252,252,252,.12);border-radius:16px;padding:20px 20px 18px;
 margin-bottom:13px;position:relative}
.choice:hover{border-color:var(--purple);background:rgba(166,99,255,.08)}
.choice b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.choice span{display:block;font-size:14px;color:rgba(252,252,252,.66);line-height:1.45;padding-right:22px}
.choice::after{content:"→";position:absolute;right:18px;top:22px;font-size:17px;
 font-weight:800;color:var(--mint)}
@media print{.choice{background:#f5f4f5;border-color:#ddd}.land .wordmark .mk{filter:invert(1)}}
</style>
</head>
